services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: supplychek
      POSTGRES_PASSWORD: supplychek
      POSTGRES_DB: supplychek
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplychek -d supplychek"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - db-data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: supplychek
      MINIO_ROOT_PASSWORD: supplychek-local-minio-demo-root-secret-not-for-production
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://supplychek:supplychek@db:5432/supplychek
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: supplychek
      S3_SECRET_KEY: supplychek-local-minio-demo-root-secret-not-for-production
      S3_BUCKET: supplychek
      S3_REGION: us-east-1
      JEV_ENABLED: "true"
      DEMO_ENROLL: "true"
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_ORIGIN: http://localhost:3000
      SESSION_SECRET: supplychek-local-session-demo-secret-32chars-min
      NODE_ENV: production
    volumes:
      - app-data:/data

volumes:
  db-data:
  minio-data:
  app-data:
